[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "search_engine"
path = "src/main.rs"

[dependencies]
rphonetic = "2.2.1"
serde_json = "1.0.149"
regex = "1.12.3"
csv = "1.4.0"
ahash = "0.8.12"
rayon = "1.11.0"
anyhow = "1.0.102"
strsim = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1