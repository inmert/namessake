[package]
name = "rust_engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust_engine"
path = "src/main.rs"

[dependencies]
axum        = "0.8.8"
tokio       = { version = "1.49.0", features = ["full"] }
serde       = { version = "1.0.228", features = ["derive"] }
# Declared explicitly — axum re-exports it transitively, but relying on that
# is fragile; a future axum version could change its feature flags silently.
serde_json  = "1"

[profile.release]
opt-level     = 3
lto           = true   # whole-program link-time optimisation
codegen-units = 1      # single CGU for maximum inlining
strip         = true   # remove debug symbols from binary